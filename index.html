<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BartGamez - Free Online Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BartGamez</h1>
    <button id="modeToggle">🌙 Dark Mode</button>
    <input type="text" id="search" placeholder="Search games...">
  </header>

  <main>
    <div class="game-list">
      <div class="card" onclick="loadGame('https://example.com/game1')">
        <h3>Game 1</h3>
      </div>
      <div class="card" onclick="loadGame('https://example.com/game2')">
        <h3>Game 2</h3>
      </div>
      <div class="card" onclick="loadGame('https://example.com/game3')">
        <h3>Game 3</h3>
      </div>
      <div class="card" onclick="loadGame('https://example.com/game4')">
        <h3>Game 4</h3>
      </div>
      <div class="card" onclick="loadGame('https://example.com/game5')">
        <h3>Game 5</h3>
      </div>
    </div>

    <div id="game-area">
      <p>Select a game to play!</p>
    </div>
  </main>

  <footer>
    <p>© 2026 BartGamez - Play free online games</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
