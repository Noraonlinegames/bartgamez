<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BartGamez - Free Online Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BartGamez 🎮</h1>
    <input type="text" id="search" placeholder="Search games..." onkeyup="searchGames()">
    <button onclick="toggleMode()">🌙 / ☀️</button>
  </header>

  <main>
    <div class="game-list">
      <!-- Example Game Card -->
      <div class="card" onclick="loadGame('https://example.com/game1')">
        <img src="images/game1.jpg" alt="Game 1">
        <h3>Game 1</h3>
      </div>

      <div class="card" onclick="loadGame('https://example.com/game2')">
        <img src="images/game2.jpg" alt="Game 2">
        <h3>Game 2</h3>
      </div>
    </div>

    <div id="game-area">
      <!-- Game iframe will load here -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
